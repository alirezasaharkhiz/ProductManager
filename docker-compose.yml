version: '3.8'

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: pms_app
        restart: unless-stopped
        volumes:
            - .:/var/www/html
        depends_on:
            - db
            - redis
        networks:
            - pms_network
        env_file:
            - .env

    nginx:
        image: nginx:alpine
        container_name: pms_nginx
        restart: unless-stopped
        ports:
            - "80:80"
        volumes:
            - .:/var/www/html
            - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - pms_network

    db:
        image: mysql:8.0
        container_name: pms_db
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
        volumes:
            - db_data:/var/lib/mysql
        ports:
            - "3306:3306"
        networks:
            - pms_network

    redis:
        image: redis:alpine
        container_name: pms_redis
        restart: unless-stopped
        ports:
            - "6379:6379"
        networks:
            - pms_network

volumes:
    db_data:

networks:
    pms_network:
        driver: bridge
